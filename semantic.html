<!-- semantic html  are the ones which are not, span or div for example
 Some common semantic elements include:

 <article>: Defines independent, self-contained content such as blog posts or news articles.
 
 <section>: Represents a thematic grouping of content, typically with a heading.

 <header>: Contains introductory content or navigational links.

 <footer>: Defines a footer for a document or section, often containing contact information or copyright details.

 <nav>: Contains navigation links.

 <aside>: Represents content that is tangentially related to the content around it, like a sidebar.

 <figure> and <figcaption>: Used for self-contained content like images or diagrams, with <figcaption> providing a caption.
